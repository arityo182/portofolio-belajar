name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medika_sentosa
          POSTGRES_USER: core
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: medikasentosa
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/medika_sentosa
          SPRING_DATASOURCE_USERNAME: core
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: ./gradlew test --no-daemon

  frontend-check:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hospital-frontendjs/package-lock.json
      - run: npm ci
        working-directory: hospital-frontendjs
      - run: npm run build
        working-directory: hospital-frontendjs

  ml-service-check:
    name: ML Service Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install & Check
        working-directory: ml-service
        run: |
          pip install fastapi uvicorn pydantic numpy pillow
          python -c "from app.main import app; print('✅ OK')"