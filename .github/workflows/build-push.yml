name: Build & Deploy

on:
  push:
    branches: [develop, main]

jobs:
  # ─── 1. BUILD & PUSH DOCKER IMAGE ───────────────────────
  build-push:
    name: Build & Push — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: medikasentosa
            image: medika-backend
            dockerfile: medikasentosa/Dockerfile.prod
          - name: frontend
            context: hospital-frontendjs
            image: medika-frontend
            dockerfile: hospital-frontendjs/Dockerfile.prod
          # - name: ml-service       # skip — butuh GPU terpisah
          #   context: ml-service
          #   image: medika-ml
          # - name: chatbot          # skip — butuh GPU terpisah
          #   context: chatbot-service
          #   image: medika-chatbot

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ─── 2. DEPLOY OTOMATIS KE STAGING (KHUSUS DEVELOP) ─────
  deploy-staging:
    name: Deploy to Staging
    needs: [build-push]
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.staging.yml
          target: ~/medika-staging/
          strip_components: 1

      - name: Deploy Staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/medika-staging
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d
            docker image prune -f
            echo "✅ Staging deployed!"

      - name: Smoke Test Staging
        run: |
          sleep 20
          curl -f http://${{ secrets.EC2_HOST }}:8090/actuator/health || exit 1
          echo "✅ Staging health check passed!"

  # ─── 3. DEPLOY OTOMATIS KE PRODUCTION (KHUSUS MAIN) ─────
  deploy-production:
    name: Deploy to Production
    needs: [build-push]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: ~/medika/
          strip_components: 1

      - name: Deploy Production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/medika
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            echo "✅ Production deployed!"

      - name: Smoke Test Production
        run: |
          sleep 20
          curl -f http://${{ secrets.EC2_HOST }}:8080/actuator/health || exit 1
          echo "✅ Production health check passed!"

