# ─── Rate Limiting Zones ──────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 80;
    server_name localhost;

    # Root folder untuk file statis React
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ─── SECURITY HEADERS ──────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS (aktifkan setelah SSL terpasang)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Sembunyikan versi Nginx
    server_tokens off;

    # Batasi max body size (cegah upload gede)
    client_max_body_size 10M;
    # Batasi koneksi per IP
    limit_conn conn 20;

    # Service worker
    location /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    # File statis (CSS/JS/assets) — cache lama
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── Proxy API ke Backend ─────────────────
    location /api/ {
        # Rate limiting 10 req/detik per IP
        limit_req zone=api burst=20 nodelay;

        # Extra strict buat login endpoint
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Security: strip internal headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ─── Fallback SPA ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
