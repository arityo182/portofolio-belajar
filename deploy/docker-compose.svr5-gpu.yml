# ─── ML Service (Docker di GPU server) ───────────────
services:
  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
      pull: false
    container_name: prod-ml-service
    restart: always
    ports:
      - "10.0.1.40:8001:8001"
    environment:
      APP_ENV: production
      ENABLE_DOCS: "false"
      INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY:?ML_INTERNAL_API_KEY wajib diisi}
      MAX_UPLOAD_BYTES: "10485760"
      MAX_CONCURRENCY: ${ML_MAX_CONCURRENCY:-2}
      INFERENCE_TIMEOUT_SECONDS: ${ML_INFERENCE_TIMEOUT:-30}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
