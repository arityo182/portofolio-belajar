# ============================================
# DOCKER COMPOSE — RS Medika Sentosa (PRODUCTION)
# ============================================
# Folder di VPS : ~/medika/
# Domain        : medika.arityodev.my.id
# Frontend port : 3000  → Nginx proxy ke sini
# Backend port  : 8080  (internal)
#
# Setup di VPS:
#   mkdir -p ~/medika
#   nano ~/medika/.env  (isi env vars)
#   docker compose -f docker-compose.prod.yml up -d
#
# Catatan:
#   - Prometheus butuh config di ~/medika/config/prometheus/
#   - Grafana butuh config di ~/medika/config/grafana/
#   - Copy dari repo: scp -r config/ ubuntu@IP:~/medika/
# ============================================

services:
  # ─── PostgreSQL 16 ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medika-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medika_sentosa}
      POSTGRES_USER: ${POSTGRES_USER:-core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-core} -d ${POSTGRES_DB:-medika_sentosa}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medika-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi}"
      - "--appendonly"
      - "yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend Spring Boot ─────────────────────
  backend:
    image: ${DOCKERHUB_USERNAME:-arityo182}/medika-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: medika-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-medika_sentosa}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-core}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      # APP_FASTAPI_URL: http://ml-service:8001         # skip — butuh GPU terpisah
      # APP_CHATBOT_URL: http://chatbot:8002             # skip — butuh GPU terpisah
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      REFRESH_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: https://medika.arityodev.my.id
      # ML/chatbot tidak di-deploy. Aktifkan kembali bila service tersebut tersedia.
      # ML_INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY}
      # CHATBOT_INTERNAL_API_KEY: ${CHATBOT_INTERNAL_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: "false"
      SPRING_CACHE_TYPE: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ─── ML Service (SKIP — butuh GPU terpisah) ──
  # ml-service:
  #   image: arityo182/medika-ml:latest
  #   pull_policy: always
  #   container_name: medika-ml-service
