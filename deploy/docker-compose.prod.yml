  #     - ALL
  #   healthcheck:
  #     test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 120s

  # ─── Chatbot Service (SKIP — butuh GPU terpisah) ──
  # chatbot:
  #   image: arityo182/medika-chatbot:latest
  #   pull_policy: always
  #   container_name: medika-chatbot
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:8002:8002"
  #   environment:
  #     APP_ENV: production
  #     ENABLE_DOCS: "false"
  #     INTERNAL_API_KEY: ${CHATBOT_INTERNAL_API_KEY:?required}
  #     VLLM_BASE_URL: ${VLLM_BASE_URL:?VLLM_BASE_URL wajib diisi}
  #     VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-14B-Instruct}
  #     VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY wajib diisi}
  #     VLLM_ALLOW_NO_KEY: "false"
  #     MAX_CONCURRENT_REQUESTS: ${CHATBOT_MAX_CONCURRENCY:-8}
  #     RATE_LIMIT_PER_MINUTE: ${CHATBOT_RATE_LIMIT:-30}
  #   volumes:
  #     - chroma_data:/app/chroma_db
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   security_opt:
