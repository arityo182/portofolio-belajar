  #   cap_drop:
  #     - ALL
  #   healthcheck:
  #     test: ["CMD", "curl", "-fsS", "http://localhost:8002/chat/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s

  # ─── Frontend (Nginx) ─────────────────────────
  frontend:
    image: ${DOCKERHUB_USERNAME:-arityo182}/medika-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: medika-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    depends_on:
      backend:
        condition: service_healthy

  # ─── Prometheus ──────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: medika-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend

  # ─── Grafana ──────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: medika-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD wajib diisi}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://medika.arityodev.my.id/grafana
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  # chroma_data:   # skip — chatbot tidak aktif
