# ============================================
# SERVER 4 — Chatbot + ML Service
# IP: 10.0.1.30 (contoh)
# ============================================
services:
  chatbot:
    build:
      context: ../chatbot-service
      dockerfile: Dockerfile
      pull: false
    container_name: prod-chatbot
    restart: always
    ports:
      - "8002:8002"
    environment:
      VLLM_BASE_URL: http://10.0.1.40:8100
      VLLM_MODEL: Qwen/Qwen2.5-14B-Instruct
      VLLM_API_KEY: ${VLLM_API_KEY:-no-key}
    volumes:
      - ../chatbot-service/knowledge_base:/app/knowledge_base:ro
      - chroma_data:/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/chat/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
      pull: false
    container_name: prod-ml-service
    restart: always
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  chroma_data:
