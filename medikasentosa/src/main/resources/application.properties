spring.application.name=medikasentosa

# Server
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Hormati X-Forwarded-* dari reverse proxy (rate limit & audit log).
server.forward-headers-strategy=framework
# API Versioning (uncomment buat production):
# server.servlet.context-path=/api/v1

# PostgreSQL (SECRET: wajib env var di production — lihat profil production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medika_sentosa}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:core}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev_password_change_me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# Upload File
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT (SECRET: minimal 32 byte acak; production profil mewajibkan env var)
app.jwt.secret=${JWT_SECRET:dev_jwt_secret_change_me_only_for_local_development_32b}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Refresh token cookie (HttpOnly). Aktifkan Secure + SameSite=None hanya bila
# frontend dan backend berada di situs berbeda.
app.auth.refresh-cookie-name=${REFRESH_COOKIE_NAME:medika_refresh}
app.auth.cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Lax}

# CORS — daftar origin dipisah koma. Jangan gunakan "*" bersama credentials.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# FastAPI ML Service
app.fastapi.url=${FASTAPI_URL:http://localhost:8001}
app.fastapi.api-key=${ML_INTERNAL_API_KEY:}

# Chatbot Service (Senta AI)
app.chatbot.url=${APP_CHATBOT_URL:http://localhost:8002}
app.chatbot.api-key=${CHATBOT_INTERNAL_API_KEY:}

# Redis (password opsional untuk development, wajib di production)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=${SPRING_CACHE_TYPE:simple}

# ============================================
# Actuator + Prometheus Monitoring
# ============================================
# Hanya health & prometheus yang diekspos; detail health tidak boleh publik.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# ============================================
# OpenAPI / Swagger — mati secara default
# ============================================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
