spring.application.name=medikasentosa

# Server
server.port=8080
# API Versioning (uncomment buat production):
# server.servlet.context-path=/api/v1

# PostgreSQL (SECRET: gunakan env var di production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medika_sentosa}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:core}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:arie12345}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Upload File
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT (SECRET: gunakan env var di production)
app.jwt.secret=${JWT_SECRET:btaIMo#,.ayTmcIF{jH|i[g3uZ2%{6J2gr,6pJi.yc4}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# FastAPI
app.fastapi.url=${FASTAPI_URL:http://localhost:8001}

# Chatbot Service (Senta AI)
app.chatbot.url=${APP_CHATBOT_URL:http://localhost:8002}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=${SPRING_CACHE_TYPE:simple}

# ============================================
# Actuator + Prometheus Monitoring
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
