# ============================================
# STAGING PROFILE — RS Medika Sentosa
# ============================================
# Staging memakai kontrak environment yang sama dengan production, tetapi
# schema masih boleh diperbarui otomatis agar environment baru bisa bootstrap.
# Semua secret wajib berasal dari environment container.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET}
app.auth.cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.fastapi.api-key=${ML_INTERNAL_API_KEY:}
app.chatbot.api-key=${CHATBOT_INTERNAL_API_KEY:}
spring.data.redis.password=${REDIS_PASSWORD}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
