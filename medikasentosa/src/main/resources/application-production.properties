# ============================================
# PRODUCTION PROFILE — RS Medika Sentosa
# ============================================
# Semua secret wajib disediakan environment, tanpa default. Profil ini
# diaktifkan lewat SPRING_PROFILES_ACTIVE=production.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Jangan pernah biarkan Hibernate mengubah skema di production.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET}
app.auth.cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.fastapi.api-key=${ML_INTERNAL_API_KEY}
app.chatbot.api-key=${CHATBOT_INTERNAL_API_KEY}
spring.data.redis.password=${REDIS_PASSWORD}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
