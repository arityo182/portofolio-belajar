# ============================================
# DOCKER COMPOSE — RS Medika Sentosa (development / single-host)
# ============================================
# Setup:
#   cp .env.example .env   (isi env vars; gunakan password acak)
#   docker compose up -d
#   docker compose down
#   docker compose logs -f [service]
#
# Catatan keamanan:
#   - Port database/Redis/backend/ML/chatbot/monitoring hanya di-bind ke
#     127.0.0.1. Hanya frontend (Nginx) yang boleh diakses dari luar.
#   - Semua password wajib berasal dari .env (tidak ada default).
# ============================================

services:
  # ─── PostgreSQL 16 ───────────────────────────
  postgres:
    image: postgres:16-alpine
    pull_policy: missing
    container_name: medika-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medika_sentosa}
      POSTGRES_USER: ${POSTGRES_USER:-core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-core} -d ${POSTGRES_DB:-medika_sentosa}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ─────────────────────────────────
  redis:
    image: redis:7-alpine
    pull_policy: missing
    container_name: medika-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi}"
      - "--appendonly"
      - "yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi}
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend Spring Boot ─────────────────────
  backend:
    build:
      context: ./medikasentosa
      dockerfile: Dockerfile
      pull: false
    container_name: medika-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-development}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-medika_sentosa}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-core}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi}
      APP_FASTAPI_URL: ${FASTAPI_URL:-http://ml-service:8001}
      APP_CHATBOT_URL: ${APP_CHATBOT_URL:-http://chatbot:8002}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi (minimal 32 byte acak)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ML_INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY:?ML_INTERNAL_API_KEY wajib diisi}
      CHATBOT_INTERNAL_API_KEY: ${CHATBOT_INTERNAL_API_KEY:?CHATBOT_INTERNAL_API_KEY wajib diisi}
      # Dipakai hanya saat membuat admin awal; aman dikosongkan bila admin sudah ada.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SPRING_CACHE_TYPE: ${SPRING_CACHE_TYPE:-simple}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ─── ML Service (FastAPI + TensorFlow) ────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
      pull: false
    container_name: medika-ml-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      APP_ENV: production
      ENABLE_DOCS: "false"
      INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY:?ML_INTERNAL_API_KEY wajib diisi}
      MAX_UPLOAD_BYTES: "10485760"
      MAX_CONCURRENCY: ${ML_MAX_CONCURRENCY:-2}
      INFERENCE_TIMEOUT_SECONDS: ${ML_INFERENCE_TIMEOUT:-30}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─── Chatbot Service (FastAPI + RAG) ──────────
  chatbot:
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
      pull: false
    container_name: medika-chatbot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      APP_ENV: production
      ENABLE_DOCS: "false"
      INTERNAL_API_KEY: ${CHATBOT_INTERNAL_API_KEY:?CHATBOT_INTERNAL_API_KEY wajib diisi}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8100}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-14B-Instruct}
      VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY wajib diisi}
      # Hanya untuk vLLM lokal tanpa auth. Deploy production TIDAK mengirim
      # variabel ini sehingga nilai default tetap false.
      VLLM_ALLOW_NO_KEY: ${VLLM_ALLOW_NO_KEY:-false}
      MAX_CONCURRENT_REQUESTS: ${CHATBOT_MAX_CONCURRENCY:-8}
      RATE_LIMIT_PER_MINUTE: ${CHATBOT_RATE_LIMIT:-30}
    volumes:
      - ./chatbot-service/knowledge_base:/app/knowledge_base:ro
      - chroma_data:/app/chroma_db
    # Agar container dapat menjangkau vLLM yang berjalan di host (lokal).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/chat/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Frontend (Nginx) ────────────────────────
  frontend:
    build:
      context: ./hospital-frontendjs
      dockerfile: Dockerfile
      pull: false
    container_name: medika-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    depends_on:
      backend:
        condition: service_healthy

  # ─── Prometheus ──────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    pull_policy: missing
    container_name: medika-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend

  # ─── Grafana ──────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    pull_policy: missing
    container_name: medika-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD wajib diisi}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  chroma_data:
