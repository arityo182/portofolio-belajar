# ============================================
# DOCKER COMPOSE — RS Medika Sentosa (STAGING)
# ============================================
# Folder di VPS : ~/medika-staging/
# Subdomain     : staging.medika.arityodev.my.id
# Frontend port : 3001  → Nginx proxy ke sini
# Backend port  : 8090  (internal)
#
# Setup di VPS:
#   mkdir -p ~/medika-staging
#   nano ~/medika-staging/.env  (isi env vars)
#   docker compose -f docker-compose.staging.yml up -d
# ============================================

services:
  # ─── PostgreSQL 16 ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medika-staging-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medika_sentosa_staging}
      POSTGRES_USER: ${POSTGRES_USER:-core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-core} -d ${POSTGRES_DB:-medika_sentosa_staging}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medika-staging-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi}"
      - "--appendonly"
      - "yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - staging_redis_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend Spring Boot ─────────────────────
  backend:
    image: arityo182/medika-backend:staging
    pull_policy: always
    container_name: medika-staging-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768m
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-medika_sentosa_staging}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-core}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      # APP_FASTAPI_URL: http://ml-service:8001         # skip — butuh GPU terpisah
      # APP_CHATBOT_URL: http://chatbot:8002             # skip — butuh GPU terpisah
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      REFRESH_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: https://staging.medika.arityodev.my.id
      # ML_INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY}     # skip — butuh GPU terpisah
      # CHATBOT_INTERNAL_API_KEY: ${CHATBOT_INTERNAL_API_KEY} # skip — butuh GPU terpisah
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: "true"
      SPRING_CACHE_TYPE: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ─── ML Service (SKIP — butuh GPU terpisah) ──
