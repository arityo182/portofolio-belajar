  #     retries: 3
  #     start_period: 30s

  # ─── Frontend (Nginx) ─────────────────────────
  frontend:
    image: arityo182/medika-frontend:staging
    pull_policy: always
    container_name: medika-staging-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    depends_on:
      backend:
        condition: service_healthy

volumes:
  staging_postgres_data:
  staging_redis_data:
  # staging_chroma_data:   # skip — chatbot tidak aktif
